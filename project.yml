name: MyApp
options:
  bundleIdPrefix: com.wailbentafat
  deploymentTarget:
    iOS: "17.0"
targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - MyApp
    info:
      path: MyApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "EcoPlog uses the camera to photograph pollution when you Spot a Clean-Up."
        NSLocationWhenInUseUsageDescription: "EcoPlog uses your location to geotag Spots and show Clean-Ups near you on the map."
        NSPhotoLibraryAddUsageDescription: "EcoPlog can save your Before/After photos and reels to your photo library."
        LSApplicationQueriesSchemes:
          - instagram-stories
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wailbentafat.MyApp
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
