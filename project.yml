name: MyApp
options:
  bundleIdPrefix: com.wailbentafat
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    # Swift 5 language mode: CoreLocation/HealthKit delegates fight Swift 6 strict concurrency.
    SWIFT_VERSION: "5.0"
targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - path: MyApp
        excludes:
          - "**/*.md"
    dependencies:
      - target: EcoPlogWidgets
    entitlements:
      path: MyApp/MyApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: MyApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - Inter.ttf
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        LSApplicationQueriesSchemes:
          - instagram-stories
        NSLocationWhenInUseUsageDescription: EcoPlog records your route while you clean up.
        NSLocationAlwaysAndWhenInUseUsageDescription: EcoPlog keeps recording your route when the screen is locked during a cleanup.
        NSHealthShareUsageDescription: EcoPlog reads your heart rate, steps and energy to show your cleanup stats.
        NSHealthUpdateUsageDescription: EcoPlog saves your cleanups as workouts in Apple Health.
        NSMotionUsageDescription: EcoPlog counts your steps during a cleanup.
        NSCameraUsageDescription: EcoPlog takes the Before and After photos of a cleanup.
        NSPhotoLibraryAddUsageDescription: EcoPlog saves your cleanup reel to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wailbentafat.MyApp
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - MyAppTests
  EcoPlogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - EcoPlogWidgets
      - MyApp/Core/LiveActivity
      - MyApp/Core/DesignSystem/EcoColors.swift
    info:
      path: EcoPlogWidgets/Info.plist
      properties:
        CFBundleDisplayName: EcoPlog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wailbentafat.MyApp.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MyAppTests
    dependencies:
      - target: MyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wailbentafat.MyAppTests
        GENERATE_INFOPLIST_FILE: YES
